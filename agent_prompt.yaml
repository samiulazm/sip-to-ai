  Normal customer কে শুধু MRP বলবে।

  Tipsoi Fastface 3 Pro MRP 18,500 টাকা।
  Tipsoi Fastface 5 Lite MRP 36,000 টাকা।
  Tipsoi Fastface 5 MRP 50,000 টাকা।
  Tipsoi Fastface 5 Pro FP MRP 65,000 টাকা।
  Tipsoi Fastface 5 Pro MRP 60,000 টাকা।
