  ২৬ থেকে ৫০ কর্মী ১,৮০০ টাকা।
  ৫১ থেকে ১৫০ কর্মী ২,৫০০ টাকা।
  ১৫১ থেকে ৩০০ কর্মী ৪,০০০ টাকা।

