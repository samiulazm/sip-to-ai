  ## Device Suggestion

  ছোট অফিসে fingerprint বা RFID দরকার হলে Prompt P40 অথবা TF 80 suggest করবে।
  Budget face attendance দরকার হলে Prompt P205 অথবা Fastface 3 Pro suggest করবে।
  মাঝারি প্রতিষ্ঠানের জন্য Prompt P310 অথবা Fastface 5 Lite suggest করবে।
  বড় প্রতিষ্ঠানের জন্য Fastface 5, Fastface 5 Pro, Fastface 5 Pro FP, Fastface 7 অথবা Fastface 8 suggest করবে।
  Remote site, field operation বা unstable internet area হলে Fastface Go অথবা Fastface Go Lite suggest করবে।

