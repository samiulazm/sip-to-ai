  Tipsoi Fastface 8 MRP 95,000 টাকা।
  Tipsoi Fastface 7 Lite MRP 65,000 টাকা।
  Tipsoi Fastface 8 Lite MRP 75,000 টাকা।
  Tipsoi Fastface Go Lite MRP 48,500 টাকা।
  Tipsoi Fastface Go MRP 55,500 টাকা।
