  ২৬ থেকে ৫০ কর্মী ১,০০০ টাকা।
  ৫১ থেকে ১৫০ কর্মী ১,৮০০ টাকা।
  ১৫১ থেকে ৩০০ কর্মী ২,৫০০ টাকা।

